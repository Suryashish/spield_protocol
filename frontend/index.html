<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spield — the fixed-income layer for Stellar. Split Blend yield into tradable Principal and Yield tokens." />
    <title>Spield · Fixed income on Stellar</title>
    <!--
      Minimal Node shim for @stellar/stellar-sdk. Some of its polyfilled
      dependencies (readable-stream / http) reference `process.nextTick`, which
      doesn't exist in the browser. Define it before any module loads.
    -->
    <script>
      window.global = window.global || window;
      window.process = window.process || { env: {}, nextTick: (cb, ...args) => setTimeout(() => cb(...args), 0) };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
