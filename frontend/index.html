<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Spield App | Fixed-Rate Yield on Stellar</title>
    <meta name="title" content="Spield App | Fixed-Rate Yield on Stellar" />
    <meta name="description" content="The Spield dApp — deposit USDC, mint and trade Principal (PT) and Yield (YT) tokens, provide liquidity, and bridge into Stellar." />
    <meta name="author" content="Spield Protocol" />
    <!--
      This host is the APPLICATION, and it is deliberately kept out of search.
      Everything indexable — the landing page, the /learn hub, the glossary and
      the comparisons — is served from the marketing site at www.spield.live
      (see ../frontendnew). Letting a wallet-gated SPA compete with it would
      only split authority between two hosts over the same brand terms.

      `follow` is intentional: outbound links from here still pass to the
      marketing site rather than dead-ending.
    -->
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#020609" />
    <meta property="og:locale" content="en_US" />

    <!-- Open Graph / Twitter. Kept despite the noindex: these drive the link
         preview when someone pastes an app URL into a chat or a support
         thread, which has nothing to do with crawling. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.spield.live/" />
    <meta property="og:title" content="Spield App — Fixed Yield on Stellar" />
    <meta property="og:description" content="Deposit, split, trade and redeem fixed-rate USDC yield on Stellar." />
    <meta property="og:image" content="https://www.spield.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spield — fixed income and yield tokenization on Stellar" />
    <meta property="og:site_name" content="Spield Protocol" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://app.spield.live/" />
    <meta name="twitter:title" content="Spield App — Fixed Yield on Stellar" />
    <meta name="twitter:description" content="Deposit, split, trade and redeem fixed-rate USDC yield on Stellar." />
    <meta name="twitter:image" content="https://www.spield.live/og-image.png" />
    <meta name="twitter:image:alt" content="Spield — fixed income and yield tokenization on Stellar" />
    <meta name="twitter:site" content="@spield_" />
    <meta name="twitter:creator" content="@spield_" />

    <!--
      Google Analytics, deferred until the page is idle so it never blocks first
      paint or steals main-thread time during the critical render. The gtag stub
      is defined up front so any early events queue, and the tag itself is
      injected after `window.load` (or on first user interaction, whichever
      comes first) via requestIdleCallback.

      NO MICROSOFT CLARITY HERE, deliberately — it runs on the marketing site
      only (see ../frontendnew/components/Analytics.tsx). Clarity records
      sessions, and on this host a session is a wallet dashboard: addresses,
      balances, position sizes and transaction amounts, all rendered as text
      nodes, which Clarity's default masking does not cover (it masks form
      inputs). The heatmaps of a wallet-gated app were not worth that.

      `send_page_view` is off because the dApp is a single document with
      client-side routes. gtag's automatic pageview only fires on the initial
      load, so it would record the arrival and nothing after it — every move
      between /vault, /markets and /liquidity would be invisible. Pageviews are
      sent per route from src/components/Analytics.tsx instead; turning the
      automatic one off is what keeps the first one from counting twice.
    -->
    <script>
      (function () {
        /* Only the real host reports. A Vercel preview of the app is a
           production build too, so without this every preview and every
           `vite dev` session writes into the production property. */
        if (!location.hostname.endsWith('spield.live')) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-Y902DS1JCN', { send_page_view: false });

        var loaded = false;
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;

          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-Y902DS1JCN';
          document.head.appendChild(ga);
        }

        function schedule() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadAnalytics, { timeout: 4000 });
          } else {
            setTimeout(loadAnalytics, 2000);
          }
        }

        // Load as soon as the page is done, or on the first real interaction.
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
          window.addEventListener(evt, loadAnalytics, { once: true, passive: true });
        });
      })();
    </script>

    <!-- Fonts. The app shell uses Plus Jakarta Sans for body text and Space
         Grotesk for headings (see src/index.css). Inter and Playfair Display
         used to be requested here for the landing page; that page now ships
         from the Next.js site, so they're gone and this request is half the
         size. Loaded non-render-blocking: the stylesheet is fetched with
         media="print" and flipped to "all" on load, so it never blocks first
         paint. `preconnect` warms the two font origins so the swap is fast. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
    <!--
      Minimal Node shim for @stellar/stellar-sdk. Some of its polyfilled
      dependencies (readable-stream / http) reference `process.nextTick`, which
      doesn't exist in the browser. Define it before any module loads.
    -->
    <script>
      window.global = window.global || window;
      window.process = window.process || { env: {}, nextTick: (cb, ...args) => setTimeout(() => cb(...args), 0) };
    </script>
    <style>
      /* Boot splash, inlined so it paints on the FIRST frame — before the app
         bundle (Stellar SDK, ethers, Reown, Allbridge, charts) has even been
         requested. React's createRoot() replaces #root's children on mount, so
         this disappears the moment the dashboard is ready. Without it the app
         subdomain opens on a white flash for the length of that download. */
      #spield-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020609;
      }
      #spield-boot img {
        width: 44px;
        height: 44px;
        animation: spieldBootPulse 1.2s ease-in-out infinite;
      }
      @keyframes spieldBootPulse {
        0%, 100% { opacity: 0.45; transform: scale(0.96); }
        50%      { opacity: 1;    transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="spield-boot">
        <img src="/logo-32.png" alt="Spield" width="44" height="44" />
      </div>
      <noscript>
        <p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;margin:0;padding:2rem;text-align:center;background:#020609;color:#b9c2ca;font-family:system-ui,sans-serif">
          The Spield app needs JavaScript to connect a wallet and read on-chain state.
          Read about the protocol at <a href="https://www.spield.live" style="color:#22d3a8">spield.live</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
