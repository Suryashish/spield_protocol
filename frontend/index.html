          "name": "Spield",
          "description": "The fixed-income layer for Stellar.",
          "inLanguage": "en",
          "publisher": { "@id": "https://www.spield.live/#organization" },
          "potentialAction": {
            "@type": "SearchAction",

          "featureList": [

            "Real on-chain Blend yield — no bridge, no wrapped assets"

          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What exactly is a PT and a YT?",
              "acceptedAnswer": { "@type": "Answer", "text": "When you deposit, Spield mints equal amounts of a Principal Token (PT) and a Yield Token (YT). PT is a zero-coupon bond that redeems 1:1 for your principal at maturity. YT is a claim on all the yield that position generates until maturity. Together they always equal the value of the original position." }

    <!--
      Analytics (Google Analytics + Microsoft Clarity) are deferred until the page
      is idle so they never block first paint or steal main-thread time during the
      critical render. gtag stubs are defined up front so any early events queue,
      and the actual tags are injected after `window.load` (or on first user
      interaction, whichever comes first) via requestIdleCallback.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y902DS1JCN');

      (function () {
        var loaded = false;
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;

          // Google Analytics
          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-Y902DS1JCN';
          document.head.appendChild(ga);

          // Microsoft Clarity
          (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
            t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
          })(window, document, 'clarity', 'script', 'wjr8mkggic');
        }

        function schedule() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadAnalytics, { timeout: 4000 });
          } else {
            setTimeout(loadAnalytics, 2000);
          }
        }

        // Load as soon as the page is done, or on the first real interaction.
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
          window.addEventListener(evt, loadAnalytics, { once: true, passive: true });
        });
      })();
    </script>

    <!-- Fonts. Landing page uses Inter / Playfair / Space Grotesk; the app shell
         (dashboard) uses Plus Jakarta Sans / Space Grotesk — see src/index.css.
         Loaded non-render-blocking: the stylesheet is fetched with media="print"
         and flipped to "all" on load, so it never blocks first paint. A <noscript>
         fallback keeps fonts for JS-disabled clients. `preconnect` warms the two
         font origins so the swap is fast. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
    <!--
      Minimal Node shim for @stellar/stellar-sdk. Some of its polyfilled
      dependencies (readable-stream / http) reference `process.nextTick`, which
      doesn't exist in the browser. Define it before any module loads.
    -->
    <script>
      window.global = window.global || window;
      window.process = window.process || { env: {}, nextTick: (cb, ...args) => setTimeout(() => cb(...args), 0) };
    </script>
    <!--
      Boot handling for #spield-seed (the static hero React replaces on mount).

      GOAL: humans never see the bare seed hero flash before the real SPA paints,
      but JS-blind crawlers/AI bots STILL get the seed's real content in the HTML.

      HOW: the seed is visible by default (so a no-JS crawler reads it). An inline
      script sets <html class="js"> the instant JS runs — which is always true for
      a real browser and never true for a JS-blind crawler. `html.js #spield-seed`
      then hides the seed's visible chrome and shows only the page's dark
      background (#020609, identical to the real landing page), so a human sees a
      clean dark screen — not the small hero — until React mounts and swaps in the
      full landing page. No flash, no layout of the seed, SEO content intact.

      Inlined (no external CSS request) so it applies on the very first paint.
      Prerendered /learn|/glossary|/compare pages have no #spield-seed → no-op.
    -->
    <script>document.documentElement.className += ' js';</script>
    <style>
      /* Only in a JS browser: keep the seed's box (dark bg) but hide its content
         so no small hero paints before the real app. Crawlers without JS never
         get .js, so they render the full seed content normally. */
      html.js #spield-seed > * {
        visibility: hidden;
      }
    </style>
  </head>
