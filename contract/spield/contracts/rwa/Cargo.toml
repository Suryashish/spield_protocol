[package]
name = "spield-rwa"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
wasm-tests = []

[dependencies]
soroban-sdk = { workspace = true }
spield-shared = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
spield-rwa-mock-oracle = { path = "../rwa-mock-oracle" }
spield-rwa-token = { path = "../rwa-token" }
spield-ustry-oracle = { path = "../ustry-oracle" }
